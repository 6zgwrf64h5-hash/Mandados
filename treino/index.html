.vrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}.vrow .ok{width:20px;color:var(--ok);font-weight:700}.vrow .tx{flex:1}.vrow.cur{background:var(--card2)}.vrow button{min-width:44px;padding:0}

function medChart(k){
  const pts=db.med.filter(m=>m[k]!=null).map(m=>({d:m.d,v:m[k]}));const f=MF.find(x=>x[0]===k);
  if(pts.length<2)return `<div class="empty" style="padding:24px">${pts.length?'Com 2 registros aparece o gráfico de '+f[1].toLowerCase()+'.':'Sem registros de '+f[1].toLowerCase()+' ainda.'}</div>`;
  const W=340,H=170,L=34,R=12,Tp=16,B=26,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1,t0=pts[0].d,t1=pts.at(-1).d,ts=(t1-t0)||1;
  const X=d=>L+(d-t0)/ts*(W-L-R),Y=v=>Tp+(1-(v-mn)/sp)*(H-Tp-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Evolução de ${f[1]}">
  <line x1="${L}" x2="${W-R}" y1="${Y(mx)}" y2="${Y(mx)}" class="gl"/><line x1="${L}" x2="${W-R}" y1="${Y(mn)}" y2="${Y(mn)}" class="gl"/>
  <text x="${L-6}" y="${Y(mx)+4}" text-anchor="end">${nf(mx)}</text><text x="${L-6}" y="${Y(mn)+4}" text-anchor="end">${nf(mn)}</text>
  <path d="${path}" class="ln"/>${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="3.5" class="pt"/>`).join('')}
  <text x="${L}" y="${H-6}">${dShort(t0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dShort(t1)}</text></svg>
  <p class="prev" style="text-align:center">${f[1]}: ${nf(pts[0].v)} → <b style="color:var(--ink)">${nf(pts.at(-1).v)} ${f[2]}</b> (${(pts.at(-1).v-pts[0].v)>=0?'+':''}${nf(pts.at(-1).v-pts[0].v)} desde ${dShort(t0)})</p>`;
}
function vMed(){
  const l=db.med.at(-1),pe=lastOf('peso');
  let h=medDue()?`<div class="note due-note">${l?'Semana nova: hora de atualizar as medidas.':'Registre suas primeiras medidas.'}</div>`:'';
  h+=`<div class="medtop"><div><small>${l?'Atualizado em '+new Date(l.d).toLocaleDateString('pt-BR'):'Nenhum registro'}</small></div>
  <button class="scale" data-a="msel" data-v="peso"><small>Peso atual</small><b>${pe?nf(pe.v):'–'}<span> kg</span></b>${delta(pe)}</button></div>
  <div class="body3"><div class="col">${pill('biceps','l')}${pill('cintura','l')}${pill('coxa','l')}</div>${BODY}<div class="col">${pill('peito','r')}${pill('gluteo','r')}${pill('panturrilha','r')}</div></div>
  <button class="pri reg" data-a="medform">Atualizar medidas</button>
  <div class="sec">Evolução</div>
  <div class="chips">${MF.map(([k,n])=>`<button class="chip ${k===medSel?'on':''}" data-a="msel" data-v="${k}">${n}</button>`).join('')}</div>
  ${medChart(medSel)}`;
  if(db.med.length)h+=`<div class="sec">Registros</div>${[...db.med].map((m,i)=>({m,i})).reverse().map(({m,i})=>`<div class="exrow"><div class="tx"><b>${new Date(m.d).toLocaleDateString('pt-BR')}</b><small>${MF.filter(([k])=>m[k]!=null).map(([k,n,u])=>n+' '+nf(m[k])).join(' · ')}</small></div><button class="ghost" data-a="mdel" data-v="${i}" aria-label="excluir registro">×</button></div>`).join('')}`;
  return h;
}
function medForm(){const today=new Date(),iso=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  openModal(`<h3>Atualizar medidas</h3><label>Data<input id="mD" type="date" value="${iso}"></label>
  <div class="g2">${MF.map(([k,n,u])=>{const o=lastOf(k);return `<label>${n} (${u})<input class="mI" data-k="${k}" type="number" inputmode="decimal" step="0.1" value="${o?o.v:''}" placeholder="–"></label>`}).join('')}</div>
  <small style="display:block;margin-top:10px">Já vem preenchido com o último valor. Deixe em branco o que não mediu.</small>
  <div class="mrow"><button data-a="closem">Cancelar</button><button class="pri" data-a="medsave">Salvar</button></div>`)}

function render(){
  const v=view.name;if(v==='workout'&&!db.active)view={name:'home'};
  const t=view.name==='workout'?T(db.active.tid):view.tid?T(view.tid):null;
  document.documentElement.style.setProperty('--c',t?t.color:'#3b82f6');
  document.body.classList.toggle('wk',view.name==='workout');
  $('#tabs').hidden=view.name==='workout';
  ['home','med','hist','cfg'].forEach(k=>$('#t-'+k).classList.toggle('on',view.name===k||(k==='home'&&['treino','done'].includes(view.name))));
  let hd,body;
  switch(view.name){
    case 'treino':hd=`<button class="ghost" data-a="home" aria-label="voltar">‹</button><span class="tile sm">${t.id}</span><div class="wt"><b>${esc(t.name)}</b><small>${esc(t.sub)} · ~${Math.round(estT(t)/60)} min</small></div>`;body=vTreino();break;
    case 'workout':hd=`<span class="tile sm">${t.id}</span><div class="wt"><b>${esc(t.name)}</b><small id="el">${leftTxt()}</small></div><button data-a="quit">Encerrar</button>`;body=vWorkout();break;
    case 'done':hd=`<h1>Treino concluído</h1>`;body=vDone();break;
    case 'cardio':hd=`<button class="ghost" data-a="cback" aria-label="voltar">‹</button><h1>Esteira</h1>`;body=vCardio();break;
    case 'hist':hd=`<h1>Histórico</h1>`;body=vHist();break;
    case 'cfg':hd=`<h1>Ajustes</h1>`;body=vCfg();break;
    case 'med':hd=`<h1>Suas medidas</h1>`;body=vMed();break;
    case 'rec':hd=`<button class="ghost" data-a="cfg" aria-label="voltar">‹</button><h1>Minha voz</h1>`;body=vRec();break;
    default:hd=`<h1>Meu treino</h1>`;body=vHome();
  }
  $('#hd').innerHTML=hd;$('#app').innerHTML=body;
}
function tick(){
  const sw=$('#sndw');if(sw)sw.hidden=!(db.active&&view.name==='workout'&&ac&&ac.state!=='running'&&!document.hidden);
  const a=db.active;if(!a)return;const r=a.rest;const elx=$('#el');if(elx)elx.textContent=leftTxt();
  if(r){const rem=remOf(r),el=r.dur-rem;
    if(!r.paused){
      if(!r.reg&&el>=r.exec){doReg();return}
      if(r.reg){const v=Math.ceil(rem),rd=r.dur-r.exec;
        if(v!==r.lv&&v>0){r.lv=v;
          if(v<=10)say(String(v),numT(v));                           /* contagem regressiva 10…1 */
          else if(v===20||v===30)say('Faltam '+v+' segundos',['w:faltam',...numT(v),'w:segundos']);
          else if(db.cfg.minute&&v%30===0&&v<rd-5)say((v===60?'Falta ':'Faltam ')+falaR(v),[v===60?'w:falta':'w:faltam',...timeT(v,1)]);}
        if(rem<=0){cycleEnd(true);return}}}
    const rt=$('#rt');if(rt){const pr=r.reg?rem:r.exec-el,pd=r.reg?r.dur-r.exec:r.exec;rt.textContent=mmss(pr);$('#rr').style.strokeDashoffset=RING*(1-pr/pd);$('#restbox').classList.toggle('warn',r.reg&&rem<=10)}}
  msUpd();
}
setInterval(tick,250);

/* ---------- edição de exercício ---------- */
function mEdit(){
  const e=edit.ex;
  if(edit.del)return openModal(`<h3>Excluir exercício?</h3><p>${esc(e.n)} sai da ficha. O histórico continua salvo.</p><div class="acts"><button class="danger" data-a="fdel2">Sim, excluir</button><button data-a="closem">Cancelar</button></div>`);
  openModal(`<h3>${edit.isNew?'Novo exercício':'Editar exercício'}</h3>
  <label>Nome<input id="fN" value="${esc(e.n)}" placeholder="Ex.: Supino reto"></label>
  <div class="g2"><label>Unidade<select id="fU">${[['kg','kg'],['anilhas','anilhas'],['corpo','peso corporal']].map(([k,l])=>`<option value="${k}" ${e.u===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>Descanso (seg)<input id="fR" type="number" inputmode="numeric" value="${e.rest}"></label></div>
  <label>Observações<textarea id="fO">${esc(e.note)}</textarea></label>
  <label>Séries (meta de reps · peso)</label>
  ${e.sets.map((s,i)=>`<div class="srow"><small>S${i+1}</small><input class="fT" value="${esc(s.t)}" aria-label="meta"><input class="fW" type="number" inputmode="decimal" step="0.5" value="${s.w}" aria-label="peso"><button data-a="fsdel" data-v="${i}" aria-label="remover série">×</button></div>`).join('')}
  <button class="addb" data-a="fsadd">+ Série</button>
  <div class="mrow">${edit.isNew?'':`<button data-a="fmove" data-v="-1" aria-label="subir">↑</button><button data-a="fmove" data-v="1" aria-label="descer">↓</button><button class="danger" data-a="fdel">Excluir</button>`}<button class="pri" data-a="fsave">Salvar</button></div>`);
}
function readForm(){const e=edit.ex;e.n=$('#fN').value.trim();e.u=$('#fU').value;e.rest=Math.max(5,parseInt($('#fR').value)||180);e.note=$('#fO').value.trim();
  e.sets=[...document.querySelectorAll('.srow')].map((row,i)=>{const t=row.querySelector('.fT').value.trim()||'10',w=parseFloat(String(row.querySelector('.fW').value).replace(',','.'))||0,o=e.sets[i];
    return{t,w,r:o&&o.t===t?o.r:(parseInt((t.match(/\d+/g)||[]).pop())||10)}})}
const busy=tid=>db.active&&db.active.tid===tid;

/* ---------- ações ---------- */
const A={
  home:()=>go('home'),hist:()=>go('hist'),cfg:()=>go('cfg'),closem:closeModal,
  open:v=>go('treino',v),
  start:v=>{if(db.active){if(db.active.tid===v)return A.resume();return openModal(`<h3>Já tem um treino em andamento</h3><p>${esc(T(db.active.tid).name)} ainda não foi encerrado.</p><div class="acts"><button class="pri" data-a="resume">Continuar o atual</button><button class="danger" data-a="forcestart" data-v="${v}">Descartar e iniciar ${esc(T(v).name)}</button></div>`)}begin(v)},
  forcestart:v=>{discard();begin(v)},
  sndw:()=>{if(ac&&ac.state!=='running')ac.resume().then(()=>scheduleBeeps()).catch(()=>{})},
  resume:()=>{const a=db.active;if(a.rest&&!a.rest.paused&&remOf(a.rest)<-5)a.rest=null;unlock();startKeepAlive();scheduleBeeps();wake();go('workout')},
  reg:()=>finishNow(),go1:()=>startCycle(),
  skipset:()=>{const a=db.active,ex=curEx();if(a.rest&&!a.rest.reg){a.rest=null;cancelBeeps()}a.seti++;if(a.seti>=ex.sets.length){const nx=nextIncomplete();if(nx<0){setCur();save();render();return finishPrompt()}a.exi=nx;a.seti=doneCount(nx)}setCur();save();render();msUpd(true)},
  prevex:()=>jump(db.active.exi-1),nextex:()=>jump(db.active.exi+1),jump:v=>jump(+v),
  adj:v=>{const[k,d]=v.split(','),a=db.active,ids={r:'#inR',w:'#inW',er:'#inER',ew:'#inEW'};
    if(k==='r'||k==='w'){a.cur[k]=Math.max(0,Math.round((+a.cur[k]+ +d)*10)/10);$(ids[k]).value=a.cur[k]}
    else if(k==='nx'){const e=a.entries.at(-1);if(!e)return;e.nx=Math.max(0,Math.round(((e.nx??e.w)+ +d)*10)/10);syncPlan(e);save();render();return}
    else{const e=a.entries.at(-1);if(!e)return;const f=k[1];e[f]=Math.max(0,Math.round((+e[f]+ +d)*10)/10);syncPlan(e);save();render();msUpd();const el=$(ids[k]);if(el)el.value=e[f];return}
    save();msUpd()},
  feel:v=>{const e=db.active.entries.at(-1);if(!e)return;e.f=e.f===v?undefined:v;save();render()},
  rp:()=>toggleRest(false),radd:v=>addRest(+v),rskip:()=>cycleEnd(false),
  undo:v=>{const a=db.active,e=a.entries[+v];if(!e)return;a.entries.splice(+v,1);const i=T(a.tid).ex.findIndex(x=>x.id===e.ex);if(i===a.exi){a.seti=doneCount(i);setCur()}save();render();toast('Série removida')},
  quit:()=>openModal(`<h3>Encerrar treino?</h3><p>${db.active.entries.length} séries registradas até agora.</p><div class="acts"><button class="pri" data-a="finish">Encerrar e salvar</button><button class="danger" data-a="discard">Descartar treino</button><button data-a="closem">Voltar</button></div>`),
  finish,discard,
  edit:v=>{const t=T(view.tid);edit={tid:t.id,ex:JSON.parse(JSON.stringify(t.ex.find(e=>e.id===v))),isNew:false};mEdit()},
  addex:()=>{if(busy(view.tid))return toast('Encerre o treino em andamento antes');edit={tid:view.tid,isNew:true,ex:{id:uid(),n:'',u:'kg',rest:180,note:'',sets:[{t:'12',w:0,r:12},{t:'10',w:0,r:10},{t:'8',w:0,r:8}]}};mEdit()},
  fsadd:()=>{readForm();const l=edit.ex.sets.at(-1)||{t:'10',w:0,r:10};edit.ex.sets.push({...l});mEdit()},
  fsdel:v=>{readForm();if(edit.ex.sets.length>1)edit.ex.sets.splice(+v,1);mEdit()},
  fsave:()=>{readForm();if(!edit.ex.n)return toast('Dê um nome ao exercício');const t=T(edit.tid);
    if(edit.isNew)t.ex.push(edit.ex);else{const i=t.ex.findIndex(e=>e.id===edit.ex.id);t.ex[i]=edit.ex;if(busy(t.id)&&db.active.exi===i){db.active.seti=Math.min(db.active.seti,edit.ex.sets.length)}}
    save();closeModal();render();toast('Salvo')},
  fmove:v=>{if(busy(edit.tid))return toast('Encerre o treino em andamento antes');readForm();const t=T(edit.tid),i=t.ex.findIndex(e=>e.id===edit.ex.id),j=i+ +v;if(j<0||j>=t.ex.length)return;t.ex[i]=edit.ex;[t.ex[i],t.ex[j]]=[t.ex[j],t.ex[i]];save();render();mEdit()},
  fdel:()=>{if(busy(edit.tid))return toast('Encerre o treino em andamento antes');readForm();edit.del=true;mEdit()},
  fdel2:()=>{const t=T(edit.tid);t.ex=t.ex.filter(e=>e.id!==edit.ex.id);save();closeModal();render();toast('Exercício excluído')},
  delsess:v=>openModal(`<h3>Excluir este registro?</h3><div class="acts"><button class="danger" data-a="delsess2" data-v="${v}">Excluir</button><button data-a="closem">Cancelar</button></div>`),
  delsess2:v=>{db.log=db.log.filter(s=>s.id!==v);save();closeModal();render()},
  testvoice:()=>{unlock();say('Faltam 30 segundos',['w:faltam','n:30','w:segundos']);const c=AC();if(c&&db.cfg.beep){beepAt(c.currentTime+.05,880,.18)}},
  export:()=>{const j=JSON.stringify({plan:db.plan,log:db.log,cfg:db.cfg,med:db.med});$('#bk').value=j;
    try{navigator.clipboard.writeText(j).then(()=>toast('Backup copiado'),()=>toast('Copie o texto da caixa'))}catch(e){toast('Copie o texto da caixa')}},
  import:()=>{try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.plan))throw 0;db.plan=o.plan;db.log=Array.isArray(o.log)?o.log:db.log;if(Array.isArray(o.med))db.med=o.med;if(o.cfg)Object.assign(db.cfg,o.cfg);save();toast('Backup importado');render()}catch(e){toast('Backup inválido')}},
  copypart:v=>{const t=scriptParts(280)[+v];$('#scr').value=t;try{navigator.clipboard.writeText(t).then(()=>toast(`Parte ${+v+1} copiada`),()=>{$('#scr').select();toast('Selecione e copie o texto abaixo')})}catch(e){$('#scr').select()}},
  copyscript:()=>{const t=scriptTxt();try{navigator.clipboard.writeText(t).then(()=>toast('Texto copiado'),()=>{$('#scr').select();toast('Selecione e copie o texto abaixo')})}catch(e){$('#scr').select()}},
  rec:()=>go('rec'),recseq:()=>{const k=nextKey();if(k)recStart(k,true)},recstop:()=>{if(rec.seq){recStop(false);recClose();render()}else recStop(true)},
  recone:v=>{if(rec.on)recStop(false);setTimeout(()=>recStart(v,false),rec.on?300:0)},
  recplay:v=>{setSession();playToks([v])},
  rectest:()=>{setSession();const t=db.plan[0],e=t&&t.ex[0];if(!e)return;const s=e.sets[0]||{t:'10',w:0};const m=String(s.t).match(/\d+/g);
    playToks(['w:descde','n:3','w:minutos','w:iniciado','w:proxex','ex:'+e.id,...numT(e.sets.length,1),'w:series','o:1',...(m?(m.length>1?[...numT(+m[0],1),'w:a',...numT(+m[1],1)]:numT(+m[0],1)):[]),'w:reps',...wT(s.w,e.u)])},
  recclear:()=>openModal(`<h3>Apagar todas as gravações?</h3><div class="acts"><button class="danger" data-a="recclear2">Apagar</button><button data-a="closem">Cancelar</button></div>`),
  recclear2:async()=>{for(const k of[...clips.keys()])await idbDel(k);clips.clear();closeModal();render()},
  hm:v=>{if(hp==='w')hw=Math.min(0,hw+ +v);else hm=Math.min(0,hm+ +v);render()},hp:v=>{hp=v;render()},
  cyes:v=>{const s=db.log.find(x=>x.id===v);if(s){s.cpend=true;save()}closeModal();go('cardio',null,v)},
  cardio:v=>go('cardio',null,v),cback:()=>go('done',null,view.sid),
  cskip:v=>{const s=db.log.find(x=>x.id===v);if(s){delete s.cpend;save()}go('done',s?.tid,v)},
  csave:v=>{const s=db.log.find(x=>x.id===v);if(!s)return;const km=parseFloat(String($('#cKm').value).replace(',','.')),mi=parseFloat(String($('#cMin').value).replace(',','.'));
    if(!(km>0)||!(mi>0))return toast('Preencha km e minutos');s.card={km:Math.round(km*100)/100,min:Math.round(mi)};delete s.cpend;if(!s.kg)s.kg=KG();save();toast('Esteira salva');go('done',s.tid,v)},
  med:()=>go('med'),medform:()=>medForm(),msel:v=>{medSel=v;render();const c=document.querySelector('.chart');c&&c.scrollIntoView({block:'center',behavior:'smooth'})},
  medsave:()=>{const dv=$('#mD').value,d=dv?new Date(dv+'T12:00').getTime():Date.now(),m={d};let n=0;
    document.querySelectorAll('.mI').forEach(i=>{const v=parseFloat(String(i.value).replace(',','.'));if(!isNaN(v)&&v>0){m[i.dataset.k]=v;n++}});
    if(!n)return toast('Preencha pelo menos uma medida');db.med.push(m);db.med.sort((a,b)=>a.d-b.d);save();closeModal();render();toast('Medidas salvas')},
  mdel:v=>openModal(`<h3>Excluir este registro de medidas?</h3><div class="acts"><button class="danger" data-a="mdel2" data-v="${v}">Excluir</button><button data-a="closem">Cancelar</button></div>`),
  mdel2:v=>{db.med.splice(+v,1);save();closeModal();render()},
  reset:()=>openModal(`<h3>Restaurar ficha original?</h3><p>Volta os 4 treinos para a ficha inicial. O histórico fica.</p><div class="acts"><button class="danger" data-a="reset2">Restaurar</button><button data-a="closem">Cancelar</button></div>`),
  reset2:()=>{if(db.active)discard();db.plan=seed().plan;save();closeModal();render();toast('Ficha restaurada')}
};
document.addEventListener('click',e=>{if(e.target.id==='modal')return closeModal();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v,b)});
document.addEventListener('input',e=>{const a=db.active;if(!a)return;const id=e.target.id,n=parseFloat(String(e.target.value).replace(',','.'))||0,last=a.entries.at(-1);
  if(id==='inR'){a.cur.r=Math.round(n);save()}
  if(id==='inW'){a.cur.w=n;save()}
  if(last&&id==='inNX'){last.nx=n;syncPlan(last);save()}
  if(last&&(id==='inER'||id==='inEW')){last[id==='inER'?'r':'w']=id==='inER'?Math.round(n):n;syncPlan(last);save()}});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
  if(d.cfgp){const v=parseFloat(String(e.target.value).replace(',','.'));if(v>0)db.cfg[d.cfgp]=v;else delete db.cfg[d.cfgp];save();return}
  if(d.cfgn){db.cfg[d.cfgn]=Math.max(5,parseInt(e.target.value)||20);e.target.value=db.cfg[d.cfgn];save();return}
  const k=d.cfg;if(!k)return;db.cfg[k]=e.target.checked;save();if(k==='wake'){e.target.checked?wake():unwake()}if(k==='beep'||k==='mvoice'||k==='voice'||k==='myvoice')scheduleBeeps();if(k==='music'&&db.active){startKeepAlive();scheduleBeeps()}});
render();
}
</script>
